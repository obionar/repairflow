{{template "head" .}}
<h1 id="ticket-new-heading" class="sr-only">{{$.Tr "repair_new.title"}}</h1>
{{template "flash" .}}

<details class="panel fold-panel" id="new-repair" open>
  <summary class="section-heading"><h2>{{$.Tr "repair_new.title"}}</h2></summary>
  <div class="panel-body">
  <form id="ticket-form" class="record-form" method="post" action="/repairs/new">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <div class="fields">
      <div class="field"><label for="customer_name">{{$.Tr "common.customer"}}</label>
        <input id="customer_name" name="customer_name" list="customer-options" value="{{.Data.Form.CustomerName}}" autocomplete="off" data-customer-autocomplete placeholder="{{$.Tr "repair_new.customer_placeholder"}}">
        <input type="hidden" id="customer_id" name="customer_id" value="{{if .Data.Form.CustomerID}}{{.Data.Form.CustomerID}}{{end}}">
        <datalist id="customer-options">{{range .Data.Customers.Items}}<option data-id="{{.ID}}" value="{{.Name}}"></option>{{end}}</datalist>
        <p class="field-hint">{{$.Tr "repair_new.customer_hint"}}</p>
      </div>
      <div class="field"><label for="device">{{$.Tr "repair_new.device_type"}}</label><input id="device" name="device" value="{{.Data.Form.Device}}" required maxlength="300" placeholder="{{$.Tr "repair_new.device_placeholder"}}"></div>
      <div class="field"><label for="brand">{{$.Tr "repair_new.brand"}}</label><input id="brand" name="brand" value="{{.Data.Form.Brand}}" maxlength="200" placeholder="{{$.Tr "repair_new.brand_placeholder"}}"></div>
      <div class="field"><label for="model">{{$.Tr "repair_new.model"}}</label><input id="model" name="model" value="{{.Data.Form.Model}}" maxlength="200" placeholder="{{$.Tr "repair_new.model_placeholder"}}"></div>
      <div class="field"><label for="serial">{{$.Tr "repair_new.serial"}}</label><input id="serial" name="serial" value="{{.Data.Form.Serial}}" maxlength="200"></div>
      <div class="field"><label for="issue">{{$.Tr "repair_new.issue"}}</label><textarea id="issue" name="issue" rows="3" required maxlength="5000">{{.Data.Form.Issue}}</textarea></div>
      <div class="field"><label for="notes">{{$.Tr "common.notes"}}</label><textarea id="notes" name="notes" rows="3" maxlength="5000">{{.Data.Form.Notes}}</textarea></div>
    </div>
    <div class="form-actions">
      <button class="primary" type="submit" id="ticket-submit">{{$.Tr "repair_new.create"}}</button>
      <a class="button quiet" href="/repairs">{{$.Tr "common.cancel"}}</a>
    </div>
  </form>
  </div>
</details>
{{template "tail" .}}
